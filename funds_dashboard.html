<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة الصناديق</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #333; }
        .cards { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 250px; text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #555; }
        .card .value { font-size: 24px; font-weight: bold; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background-color: #2c3e50; color: white; font-weight: normal; }
        tr:hover { background-color: #f9f9f9; }
        .profit { color: #27ae60; font-weight: bold; }
        .loss { color: #e74c3c; font-weight: bold; }
        .btn { display: block; width: 200px; margin: 20px auto; padding: 10px; text-align: center; background: #3498db; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 لوحة متابعة الصناديق الاستثمارية</h1>
        
        <div class="cards" id="summaryCards">
            <!-- سيتم ملؤها بواسطة JavaScript -->
        </div>

        <table id="fundsTable">
            <thead>
                <tr>
                    <th>اسم الصندوق</th>
                    <th>النوع</th>
                    <th>سعر الشراء</th>
                    <th>السعر الحالي (NAV)</th>
                    <th>عدد الوثائق</th>
                    <th>الربح/الخسارة العائم</th>
                    <th>النسبة</th>
                </tr>
            </thead>
            <tbody id="fundsBody">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // دالة لجلب البيانات من ملف JSON
        async function loadData() {
            try {
                // لاحظ: سنستخدم مسار نسبي، ويجب أن يكون الملفان في نفس المجلد
                const response = await fetch('funds.json');
                const funds = await response.json();
                
                renderDashboard(funds);
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                document.getElementById('fundsBody').innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">تعذر تحميل البيانات. تأكد من وجود ملف funds.json.</td></tr>`;
            }
        }

        function renderDashboard(funds) {
            let totalInvested = 0;
            let totalCurrentValue = 0;
            let totalProfitLoss = 0;

            const tbody = document.getElementById('fundsBody');
            tbody.innerHTML = '';

            funds.forEach(fund => {
                const currentValue = fund.units * fund.current_nav;
                const costValue = fund.units * fund.avg_cost;
                const profitLoss = currentValue - costValue;
                const percentage = (profitLoss / costValue) * 100;

                totalInvested += costValue;
                totalCurrentValue += currentValue;
                totalProfitLoss += profitLoss;

                const row = `
                    <tr>
                        <td>${fund.name}</td>
                        <td>${fund.type}</td>
                        <td>${fund.avg_cost.toFixed(2)}</td>
                        <td>${fund.current_nav.toFixed(2)}</td>
                        <td>${fund.units.toFixed(2)}</td>
                        <td class="${profitLoss >= 0 ? 'profit' : 'loss'}">${profitLoss.toFixed(2)}</td>
                        <td class="${percentage >= 0 ? 'profit' : 'loss'}">${percentage.toFixed(2)}%</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // تحديث الكروت العلوية
            const overallPercentage = (totalProfitLoss / totalInvested) * 100;
            document.getElementById('summaryCards').innerHTML = `
                <div class="card">
                    <h3>إجمالي المستثمر</h3>
                    <div class="value">${totalInvested.toFixed(2)} ج.م</div>
                </div>
                <div class="card">
                    <h3>القيمة الحالية</h3>
                    <div class="value">${totalCurrentValue.toFixed(2)} ج.م</div>
                </div>
                <div class="card">
                    <h3>الربح/الخسارة الإجمالية</h3>
                    <div class="value ${totalProfitLoss >= 0 ? 'profit' : 'loss'}">${totalProfitLoss.toFixed(2)} ج.م (${overallPercentage.toFixed(2)}%)</div>
                </div>
            `;
        }

        // تشغيل الدالة عند تحميل الصفحة
        loadData();
    </script>
</body>
</html>
