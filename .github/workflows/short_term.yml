name: EGX Short-Term Bot (Swing)

on:
  # كل 15 دقيقة خلال جلسة البورصة (10:00 - 14:30 القاهرة = 8:00 - 12:30 UTC)
  schedule:
    - cron: '0,15,30,45 8-11 * * 0-4'   # الأحد - الخميس (0=Sunday في GitHub)
    - cron: '0,15,30 12 * * 0-4'        # حتى 12:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: '1 = تشغيل يدوي خارج أوقات السوق'
        default: '1'

permissions:
  contents: write

jobs:
  run-short:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check market hours
        id: market
        run: |
          H=$(TZ=Africa/Cairo date +%-H)
          M=$(TZ=Africa/Cairo date +%-M)
          D=$(TZ=Africa/Cairo date +%u)
          FORCE=${{ github.event.inputs.force || '0' }}
          RUN=false
          if [ "$FORCE" = "1" ]; then RUN=true; fi
          if [ "$RUN" = "false" ]; then
            # الأحد=7 (في بعض الأنظمة)، الاثنين=1 ... الخميس=4
            if [ "$D" -ge 1 ] && [ "$D" -le 4 ] || [ "$D" -eq 7 ]; then
              if [ "$H" -ge 10 ] && [ "$H" -lt 14 ]; then RUN=true; fi
              if [ "$H" -eq 14 ] && [ "$M" -le 30 ]; then RUN=true; fi
            fi
          fi
          echo "run=$RUN" >> $GITHUB_OUTPUT
          echo "force=$FORCE" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.market.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.market.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run short-term bot
        if: steps.market.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          MEASUREMENT_MODE: ${{ secrets.MEASUREMENT_MODE || '1' }}
          FORCE_RUN: ${{ steps.market.outputs.force }}
        run: python bot.py short

      - name: Save state files
        if: steps.market.outputs.run == 'true'
        run: |
          git config user.name "EGX Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f \
            short_positions.json \
            long_positions.json \
            stocks_dna_memory.json \
            sector_dna_memory.json \
            daily_stats.json \
            fundamentals_cache.json \
            2>/dev/null || true
          git diff --cached --quiet || git commit -m "state update (short) [skip ci]"
          git push || echo "No changes to push"
